# Lead + solver (agent_tool). The solver runs in its own runner, so its history is never
# compacted and it never loops on submit_patch. All agents share the 28-call and 8-minute budgets;
# the solver is told 25 calls so the lead keeps a few for the empty-patch guard.
evaluation:
  timeout_seconds: 240
  max_tool_calls: 28
  max_time_minutes: 8
  max_turns: 80
