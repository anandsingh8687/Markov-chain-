# Per-task budget. The whole hidden run (~120 tasks) must finish in 12 hours:
# v1 and v2d shipped no eval_config, got the 60-minute default per task and were
# both rejected for exceeding the runtime limit. 18 minutes keeps even a
# 4-way-parallel run (120 x ~20 min / 4 = 600 min) under the 720-minute limit.
# timeout_seconds equals the task budget, so it is safe whether it means the
# per-command or the per-task timeout; prompts use `timeout 240` on tests.
evaluation:
  timeout_seconds: 1080
  max_time_minutes: 18
  max_turns: 300
